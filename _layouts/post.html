---
layout: default
---
<div class="simple-content">
  <article class="post-header">
    <a href="{{ '/' | relative_url }}" class="back-link">← Posts</a>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {% if page.tags %}
        {% for tag in page.tags %}
          · <span class="tag">{{ tag }}</span>
        {% endfor %}
      {% endif %}
    </div>
  </article>
  <div class="prose">
    {{ content }}
  </div>
</div>
